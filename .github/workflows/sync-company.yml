name: Sync Company

on:
  workflow_dispatch:
    inputs:
      tax_id:
        description: "42833103"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync official company data
        env:
          TAX_ID: ${{ inputs.tax_id }}
        run: python3 scripts/sync_company.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/companies
          git diff --cached --quiet || git commit -m "Sync company ${{ inputs.tax_id }}"
          git push
