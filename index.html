<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>企業資料／法院裁判書查詢</title>
  <meta name="description" content="依統一編號查詢公司登記資料及相關法院裁判書">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">企業司法資料查詢</div>
  <div class="sub">公司登記 × 法院裁判書</div>
</header>

<main class="container">
  <section class="search-panel">
    <h1>輸入統一編號</h1>
    <p class="hint">請輸入 8 位數公司統一編號</p>
    <div class="search-row">
      <input id="taxId" maxlength="8" inputmode="numeric" placeholder="例如：12345678">
      <button id="searchBtn">查找</button>
    </div>
    <div id="message" class="message"></div>
  </section>

  <section id="companySection" class="card hidden">
    <div class="section-title">
      <h2>公司基本資料</h2>
      <span id="statusBadge" class="badge"></span>
    </div>
    <div id="companyGrid" class="data-grid"></div>
  </section>

  <section id="businessSection" class="card hidden">
    <div class="section-title"><h2>所營事業資料</h2></div>
    <div id="businessItems"></div>
  </section>

  <section id="judgmentSection" class="card hidden">
    <div class="section-title">
      <h2>法院裁判書</h2>
      <span id="judgmentCount" class="count"></span>
    </div>
    <p id="judgmentSearchInfo" class="hint"></p>
    <div id="judgments"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="closeModal" class="modal-close">×</button>
    <h2 id="modalTitle"></h2>
    <div id="modalContent"></div>
  </div>
</div>

<footer>
  <p>資料來源請以各官方資料服務最新公開內容為準。</p>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
