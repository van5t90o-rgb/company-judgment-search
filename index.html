<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>台灣公司暨裁判書查詢</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>台灣公司暨裁判書查詢</h1>
  <p>公司資料來自經濟部商業發展署；裁判書連結至司法院官方系統。</p>
</header>

<main>
  <section class="search-card">
    <label for="taxId">統一編號</label>
    <div class="search-row">
      <input id="taxId" maxlength="8" inputmode="numeric" placeholder="請輸入 8 碼統一編號">
      <button id="searchBtn">查詢</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section id="companySection" class="card hidden">
    <h2>公司基本資料</h2>
    <div id="companyGrid" class="grid"></div>

    <h2>所營事業資料</h2>
    <div id="businessItems"></div>

    <h2>司法院裁判書查詢</h2>
    <div id="judicialLinks"></div>
    <p class="hint">司法院公開查詢系統會在官方網站顯示搜尋結果；本 GitHub Pages 版本不使用第三方代理伺服器。</p>
  </section>
</main>

<footer>GitHub Pages 純前端版本</footer>
<script src="js/config.js"></script>
<script src="js/company-api.js"></script>
<script src="js/judicial.js"></script>
<script src="js/app.js"></script>
</body>
</html>
