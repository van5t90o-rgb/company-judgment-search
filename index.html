<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企業資料 × 法院裁判書查詢</title>
<meta name="description" content="依統一編號查詢公司資料及相關法院裁判書">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="logo">企業司法查詢</div>
    <div class="hero-sub">公司登記資料 × 所營事業 × 法院裁判書</div>
  </div>
</header>

<main class="wrap">
  <section class="search-card">
    <div class="eyebrow">COMPANY SEARCH</div>
    <h1>輸入統一編號</h1>
    <p>查找公司基本資料，並自動以公司名稱與代表人姓名查詢法院裁判書。</p>
    <div class="search-line">
      <input id="taxId" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="請輸入 8 位數統一編號">
      <button id="searchBtn">查找</button>
    </div>
    <div id="message"></div>
  </section>

  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <div>
      <b>正在查詢</b>
      <span id="loadingText">公司資料 → 所營事業 → 法院裁判書</span>
    </div>
  </div>

  <section id="companySection" class="card hidden">
    <div class="card-head">
      <h2>公司基本資料</h2>
      <span id="statusBadge" class="badge"></span>
    </div>
    <div id="companyGrid" class="company-grid"></div>
  </section>

  <section id="businessSection" class="card hidden">
    <div class="card-head"><h2>所營事業資料</h2></div>
    <div id="businessItems"></div>
  </section>

  <section id="judgmentSection" class="card hidden">
    <div class="card-head">
      <div>
        <h2>法院裁判書</h2>
        <p id="judgmentSearchInfo" class="muted"></p>
      </div>
      <div id="judgmentCount" class="count"></div>
    </div>

    <div class="filters">
      <button class="filter active" data-filter="all">全部</button>
      <button class="filter" data-filter="民事">民事</button>
      <button class="filter" data-filter="刑事">刑事</button>
      <button class="filter" data-filter="行政">行政</button>
      <button class="filter" data-filter="其他">其他</button>
    </div>

    <div id="judgments"></div>
  </section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<footer>
  <div>公司資料來源：經濟部商業發展署公開資料</div>
  <div>裁判資料來源：司法院裁判書系統／裁判書開放 API</div>
</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
